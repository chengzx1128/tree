<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Christmas Tree</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#000}
canvas{display:block}
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0xffffff,0.8,100);
pointLight.position.set(10,20,10);
scene.add(pointLight);

// 树干
const trunkGeo = new THREE.CylinderGeometry(0.4,0.6,4,8);
const trunkMat = new THREE.MeshLambertMaterial({color:0x8b4513});
const trunk = new THREE.Mesh(trunkGeo,trunkMat);
trunk.position.y = -4;
scene.add(trunk);

// 圣诞树分层
const treeMat = new THREE.MeshLambertMaterial({color:0x009933});
for(let i=0;i<5;i++){
    const r = 5 - i*0.8;
    const h = 3;
    const geo = new THREE.ConeGeometry(r,h,8);
    const cone = new THREE.Mesh(geo,treeMat);
    cone.position.y = -2 + i*2.2;
    scene.add(cone);
}

// 星星
const starShape = new THREE.Shape();
const sx = 0, sy = 0;
for(let i=0;i<5;i++){
    const ang = (i*72 -90)*Math.PI/180;
    const a2 = ((i*72+36)-90)*Math.PI/180;
    const r1 = 2; const r2 = 0.9;
    starShape.lineTo(sx + Math.cos(ang)*r1, sy + Math.sin(ang)*r1);
    starShape.lineTo(sx + Math.cos(a2)*r2, sy + Math.sin(a2)*r2);
}
const starGeo = new THREE.ShapeGeometry(starShape);
const starMat = new THREE.MeshLambertMaterial({color:0xffdd00,side:THREE.DoubleSide});
const star = new THREE.Mesh(starGeo,starMat);
star.rotation.x = -Math.PI/2;
star.position.y = 8.2;
scene.add(star);

// 文字：xinxin
const textStr = "xinxin";
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
canvas.width = 1024; canvas.height = 256;
ctx.fillStyle="#fff";
ctx.font="bold 80px sans-serif";
ctx.textAlign="center";
ctx.fillText(textStr,512,130);
const tex = new THREE.CanvasTexture(canvas);
const textMat = new THREE.MeshBasicMaterial({map:tex,transparent:true});
const textGeo = new THREE.PlaneGeometry(8,2);
const textMesh = new THREE.Mesh(textGeo,textMat);
textMesh.position.y = 10;
scene.add(textMesh);

// 彩球
const ballColors = [0xff3333,0x3388ff,0xffdd22,0xff44aa,0x22dd88];
for(let i=0;i<60;i++){
    const bGeo = new THREE.SphereGeometry(0.22,12,12);
    const bMat = new THREE.MeshLambertMaterial({color:ballColors[Math.floor(Math.random()*ballColors.length)]});
    const ball = new THREE.Mesh(bGeo,bMat);
    const r = Math.random()*4.2;
    const ang = Math.random()*Math.PI*2;
    const y = Math.random()*6 - 3;
    ball.position.set(Math.cos(ang)*r, y, Math.sin(ang)*r);
    scene.add(ball);
}

// 雪花
const snowGeo = new THREE.BufferGeometry();
const snowCount = 400;
const snowPos = new Float32Array(snowCount*3);
for(let i=0;i<snowCount;i++){
    snowPos[i*3] = (Math.random()-0.5)*30;
    snowPos[i*3+1] = Math.random()*20;
    snowPos[i*3+2] = (Math.random()-0.5)*30;
}
snowGeo.setAttribute('position',new THREE.BufferAttribute(snowPos,3));
const snowMat = new THREE.PointsMaterial({color:0xffffff,size:0.18});
const snow = new THREE.Points(snowGeo,snowMat);
scene.add(snow);

camera.position.z = 15;

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    snow.rotation.y += 0.0004;
    const pos = snow.geometry.attributes.position.array;
    for(let i=0;i<snowCount;i++){
        pos[i*3+1] -= 0.025;
        if(pos[i*3+1]<-5) pos[i*3+1]=20;
    }
    snow.geometry.attributes.position.needsUpdate = true;
    renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
})
</script>
</body>
</html>
